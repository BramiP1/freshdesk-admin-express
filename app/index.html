<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freshsales Match</title>
    <link rel="stylesheet" href="styles/style.css" />
    <script defer src="https://static.freshdev.io/fdk/2.0/assets/fresh_client.js"></script>
    <script defer src="scripts/app.js"></script>
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <span id="matchBadge" class="match-badge">...</span>
      </header>

      <section id="stateLoading" class="state">Loading...</section>
      <section id="stateError" class="state hidden" role="alert"></section>
      <section id="stateEmpty" class="state hidden">No Freshsales matches found for this requester.</section>

      <section id="stateResults" class="hidden">
        <label for="matchSelect">Select a mailbox</label>
        <select id="matchSelect"></select>

        <table class="info-table summary-table">
          <tr>
            <td class="info-label">Mailbox ID</td>
            <td class="info-value" id="summaryMailboxId"></td>
          </tr>
          <tr>
            <td class="info-label">1583 Status</td>
            <td class="info-value" id="summaryStatus"></td>
          </tr>
          <tr>
            <td class="info-label">Open Tickets</td>
            <td class="info-value" id="summaryOpenTickets">—</td>
          </tr>
          <tr>
            <td class="info-label">Lifetime Tickets</td>
            <td class="info-value" id="summaryLifetimeTickets">—</td>
          </tr>
        </table>

        <button id="viewDetailsBtn" class="details-btn">View Full Details</button>
      </section>
    </main>
  </body>
</html>
